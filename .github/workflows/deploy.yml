name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages and request the OIDC token used by deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; cancel in-progress runs of the same group.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static SPA for GitHub Pages
        env:
          DEPLOY_TARGET: github-pages
          # Project page at https://lumin8hub.github.io/torontosheltermap/,
          # so assets must be served from "/torontosheltermap/".
          BASE_PATH: /torontosheltermap/
          # Supabase config for the /stakeout/ scheduler. The publishable
          # (anon) key is safe to ship in the bundle by design — RLS is the
          # actual gate (see supabase/README.md, EPIC 2.7 verification).
          # Keeping them as repo secrets just lets us rotate without a code
          # change. If unset, the /stakeout/ page renders a placeholder
          # instead of crashing the rest of the site.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: bun run build

      - name: Prepare GitHub Pages output
        # TanStack Start's SPA build emits the static site under dist/client/.
        # It may emit _shell.html instead of a root index.html, so we ensure
        # Pages has both index.html for the site root and 404.html for SPA
        # fallback navigation. We also add .nojekyll so GitHub Pages serves
        # underscore-prefixed files.
        run: |
          set -eu
          OUT=dist/client
          if [ ! -d "$OUT" ]; then
            echo "Build output not found at $OUT. Contents of dist:" >&2
            ls -la dist || true
            exit 1
          fi

          if [ -f "$OUT/_shell.html" ]; then
            SHELL_HTML="$OUT/_shell.html"
          elif [ -f "$OUT/index.html" ]; then
            SHELL_HTML="$OUT/index.html"
          else
            echo "Neither _shell.html nor index.html exist in $OUT." >&2
            ls -la "$OUT"
            exit 1
          fi

          if [ ! -f "$OUT/index.html" ]; then
            cp "$SHELL_HTML" "$OUT/index.html"
          fi
          cp "$SHELL_HTML" "$OUT/404.html"

          touch "$OUT/.nojekyll"

          echo "Final $OUT contents:"
          ls -la "$OUT"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/client
          # Required so .nojekyll (and any other dotfile we ship) makes it into
          # the artifact — upload-pages-artifact v5 excludes hidden files by default.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
